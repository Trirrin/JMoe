name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    uses: ./.github/workflows/_analyze.yml

  build-apk:
    needs: analyze-and-test
    uses: ./.github/workflows/_build-android.yml

  build-ios:
    needs: analyze-and-test
    uses: ./.github/workflows/_build-ios.yml

  build-ohos:
    needs: analyze-and-test
    uses: ./.github/workflows/_build-ohos.yml
