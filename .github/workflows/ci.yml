name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# ============================================================================
# 三平台构建
#
# | 平台 | Runner | Flutter SDK | 产物 |
# |---|---|---|---|
# | Android | ubuntu | 官方 stable 3.47.9 | APK (per ABI) |
# | iOS | macos | 官方 stable 3.47.9 | IPA |
# | HarmonyOS | ubuntu | OHOS 分支 oh-3.47.7-dev | HAP |
#
# # 鸿蒙构建的关键参考
#
# 本 job 的配置参考了 Kazumi 的鸿蒙分支
# （https://github.com/ErBWs/Kazumi 的 feat-ohos 分支），
# 该分支由 ErBWs 维护，已稳定产出 HarmonyOS NEXT 的 hap 包。
#
# 核心做法：
#   * 用 `ErBWs/setup-ohos` Action 一键安装 HarmonyOS 命令行工具
#     （它从 https://github.com/ErBWs/ohos-sdk 拉取分割好的 SDK）
#   * Flutter 用 OHOS 分支：gitcode.com/CPF-Flutter/flutter_flutter
#   * 构建带 `--no-codesign`（未签名 HAP，装机需自行签名）
#
# 注意：**不需要 Windows runner**。早期鸿蒙命令行工具只有 Windows 版，
# 现在 Linux 版齐全（含 hms 组件的 .so），ubuntu 即可构建。
#
# # 可选 Secrets（见 docs/SIGNING.md）
#   Android: ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#            ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   iOS:     IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD /
#            IOS_PROVISION_PROFILE_BASE64 / IOS_TEAM_ID
# ============================================================================

env:
  FLUTTER_STABLE: '3.47.9'
  # 与项目 pubspec 的 Dart 约束 ^3.13.x 兼容（该分支为 Dart 3.13.5）
  FLUTTER_OHOS_REPO: 'https://gitcode.com/CPF-Flutter/flutter_flutter.git'
  FLUTTER_OHOS_BRANCH: 'oh-3.47.7-dev'
  # HarmonyOS 命令行工具版本（留空 = 用 setup-ohos 的最新版）
  OHOS_CLI_VERSION: '26.0.0.821'

jobs:
  # ---------------------------------------------------------------- 分析/测试
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_STABLE }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # ---------------------------------------------------------------- Android
  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_STABLE }}
          channel: stable
          cache: true
      - run: flutter pub get

      # 使用 debug 签名（与 Kazumi 一致）：
      # 产物可直接侧载安装，无需配置 keystore。
      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: jmoe-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_STABLE }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          [ -d "$APP" ] || { echo "Runner.app 未生成"; exit 1; }
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry JMoe-unsigned.ipa Payload
          ls -lh JMoe-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: jmoe-ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------- HarmonyOS
  build-ohos:
    # 构建鸿蒙 HAP。
    #
    # 参考 Kazumi 的 feat-ohos 分支做法（ErBWs 维护）：
    #   * ErBWs/setup-ohos 负责装 HarmonyOS 命令行工具
    #   * Flutter 用 OHOS 分支
    #   * flutter build hap --release --no-codesign
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      # libGL1 是鸿蒙资源编译（纹理压缩）的依赖；
      # xz-utils/zip 用于解压 SDK；cmake/ninja 用于 native 构建
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa libgl1-mesa-dev \
            cmake ninja-build g++ jq

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_CLI_VERSION }}
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup flutter-ohos
        run: |
          git clone --depth 1 -b $FLUTTER_OHOS_BRANCH $FLUTTER_OHOS_REPO $GITHUB_WORKSPACE/flutter-ohos
          # 该分支没有 git tag，Flutter 会自报 0.0.0-unknown
          # 导致 pub get 的 SDK 约束校验失败，这里补一个本地 tag
          cd $GITHUB_WORKSPACE/flutter-ohos
          git tag 3.47.7
          echo "$GITHUB_WORKSPACE/flutter-ohos/bin" >> $GITHUB_PATH

      - name: Show OHOS Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      # flutter.har 必须在 ohos/har 下，否则 ArkTS 编译时报
      # 「@ohos/flutter_ohos 无法解析」。flutter build hap 一般会
      # 自动放入，但这里显式检查/补齐，避免版本差异导致漏掉。
      - name: Ensure flutter.har
        run: |
          set -e
          HAR_DIR="$GITHUB_WORKSPACE/flutter-ohos/bin/cache/artifacts/engine"
          SRC=""
          for p in "$HAR_DIR/ohos-arm64-release/flutter.har" \
                   "$HAR_DIR/ohos-arm64/flutter.har"; do
            if [ -f "$p" ]; then SRC="$p"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "::warning::未找到 flutter.har，尝试 precache"
            flutter precache --ohos || true
            for p in "$HAR_DIR/ohos-arm64-release/flutter.har" \
                     "$HAR_DIR/ohos-arm64/flutter.har"; do
              if [ -f "$p" ]; then SRC="$p"; break; fi
            done
          fi
          mkdir -p ohos/har
          if [ -n "$SRC" ]; then
            cp "$SRC" ohos/har/flutter.har
            ls -lh ohos/har/flutter.har
          elif [ -s ohos/har/flutter.har ]; then
            echo "已有 flutter.har，跳过"
          else
            echo "::error::缺少 flutter.har，构建会失败"
            exit 1
          fi

      - name: Build HAP
        run: flutter build hap --release --no-codesign

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: jmoe-hap
          # 产物路径与本地构建一致
          path: ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-apk, build-ios, build-ohos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: jmoe-apk, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: jmoe-ios, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: jmoe-hap, path: dist }

      - name: Rename artifacts
        run: |
          cd dist
          i=0
          for f in *.apk; do
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed -E 's/app-([a-z0-9_-]+)-release\.apk/\1/')
            mv "$f" "JMoe-${GITHUB_REF_NAME}-$arch.apk" 2>/dev/null || true
          done
          for f in *.ipa; do
            [ -f "$f" ] && mv "$f" "JMoe-${GITHUB_REF_NAME}-ios.ipa" || true
          done
          for f in *.hap; do
            [ -f "$f" ] && mv "$f" "JMoe-${GITHUB_REF_NAME}-ohos.hap" || true
          done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
