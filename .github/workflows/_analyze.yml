name: Analyze

on:
  workflow_call:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/git
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            build
          key: dart-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'lib/**') }}
          restore-keys: dart-${{ runner.os }}-

      - run: flutter analyze --no-fatal-infos

      - run: flutter test
